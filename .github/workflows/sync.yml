name: Sync TDLib schemas

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tdlib-schemas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out schema repository
        uses: actions/checkout@v4

      - name: Check out TDLib history
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master
          fetch-depth: 0
          path: .vendor/td

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test extractor
        run: npm test

      - name: Sync schemas
        run: npm run sync -- --td-repo .vendor/td

      - name: Commit generated changes
        run: |
          if git diff --quiet -- schemas; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add schemas
          git commit -m "schema: sync TDLib API layers"
          git push
